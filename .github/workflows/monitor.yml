name: Weekly Monitor

on:
  schedule:
    - cron: "0 22 * * 1"
  workflow_dispatch:
    inputs:
      season:
        description: "Season year; blank uses the current UTC year"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: weekly-monitor
  cancel-in-progress: false

jobs:
  monitor:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      status: ${{ steps.monitor.outputs.status }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve season and require credentials
        id: season
        env:
          INPUT_SEASON: ${{ inputs.season }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          season="${INPUT_SEASON:-$(date -u +%Y)}"
          if [[ ! "$season" =~ ^(19|20|21)[0-9]{2}$ ]]; then
            echo "::error::Invalid monitor season"
            exit 1
          fi
          echo "year=$season" >> "$GITHUB_OUTPUT"
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::error::Credential failure: create CLOUDFLARE_API_TOKEN with D1 read access"
            exit 3
          fi

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4"

      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/tipper
          key: ${{ runner.os }}-tipper-monitor-${{ steps.season.outputs.year }}-${{ hashFiles('bun.lock') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-tipper-monitor-${{ steps.season.outputs.year }}-${{ hashFiles('bun.lock') }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Score and capture monitor row
        id: monitor
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SEASON: ${{ steps.season.outputs.year }}
        run: |
          set +e
          bun src/cli/index.ts monitor --season "$SEASON" --log
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          case "$status" in
            0|2) ;;
            3) echo "::error::Credential failure: check the D1 API token scope and expiry"; exit 3 ;;
            4) echo "::error::Squiggle unavailable: retry when the field API recovers"; exit 4 ;;
            *) echo "::error::Monitor failed before producing a score (exit $status)"; exit 1 ;;
          esac
          head -n 1 analysis/monitor-log.csv > "$RUNNER_TEMP/monitor-row.csv"
          tail -n 1 analysis/monitor-log.csv >> "$RUNNER_TEMP/monitor-row.csv"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: monitor-row
          path: ${{ runner.temp }}/monitor-row.csv
          if-no-files-found: error
          retention-days: 7

  commit-log:
    needs: monitor
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: monitor-row
          path: ${{ runner.temp }}/monitor

      - name: Merge the new row into the latest log
        run: |
          python3 - <<'PY'
          import csv
          import os
          from pathlib import Path

          incoming = Path(os.environ["RUNNER_TEMP"]) / "monitor/monitor-row.csv"
          target = Path("analysis/monitor-log.csv")
          with incoming.open(newline="") as stream:
              reader = csv.DictReader(stream)
              fields = reader.fieldnames
              rows = list(reader)
          if len(rows) != 1 or None in rows[0] or any(v is None for v in rows[0].values()):
              raise SystemExit("Invalid monitor row")
          row = rows[0]
          old = []
          if target.exists():
              with target.open(newline="") as stream:
                  reader = csv.DictReader(stream)
                  if reader.fieldnames != fields:
                      raise SystemExit("Monitor CSV header changed")
                  old = [value for value in reader if value["run_date"] != row["run_date"]]
          target.parent.mkdir(parents=True, exist_ok=True)
          with target.open("w", newline="") as stream:
              writer = csv.DictWriter(stream, fieldnames=fields, lineterminator="\n")
              writer.writeheader()
              writer.writerows([*old, row])
          PY

      - name: Commit monitor log
        run: |
          git add analysis/monitor-log.csv
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ci: update weekly monitor log' \
            -m 'Co-authored-by: Codex <noreply@openai.com>'
          git push origin HEAD:main

      - name: Fail the run for a genuine market alert
        if: needs.monitor.outputs.status == '2'
        run: |
          echo "::error::Market-gap alert: monitor row committed; investigate the scored gap"
          exit 2
