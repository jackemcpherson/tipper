name: Weekly report check

on:
  schedule:
    - cron: "30 23 * * 1"
  workflow_dispatch:
    inputs:
      season:
        description: "Season year; blank uses the current UTC year"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: weekly-report
  cancel-in-progress: false

jobs:
  monitor:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Download retained report
        env:
          INPUT_SEASON: ${{ inputs.season }}
        run: |
          season="${INPUT_SEASON:-$(date -u +%Y)}"
          [[ "$season" =~ ^(19|20)[0-9]{2}$ ]] || exit 1
          curl --fail-with-body --silent --show-error --retry 3 --max-time 30 \
            "https://tipper.jackemcpherson.workers.dev/performance?year=${season}" \
            --output report.json

      - name: Retain report evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: weekly-report
          path: report.json
          if-no-files-found: error
          retention-days: 90

      - name: Check coverage, freshness and performance alert
        run: |
          jq --exit-status '.status == "ok" and .stale == false and .report != null
            and .report.alert == false and (.report.coverage.missing | length) == 0' report.json
