name: CI

on:
  pull_request:
    branches: [main]
  # Pushes to main run this once, as the gate in publish-artifact.yml.
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a main run: every main revision needs its published artefact.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format, lint and type-aware checks
        run: bun run check

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Test
        run: bun run test
